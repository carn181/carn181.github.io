{{ define "main" }}
  <div class="home-intro">
    {{ .Content }}
  </div>

  {{ $posts := where site.RegularPages "Section" "posts" }}
  {{ if $posts }}
  <section class="home-posts">
    <hr style="border: 0; border-top: 1px solid #504945; margin: 1.5rem 0;" />
    <h3>Recent Posts</h3>
    <ul class="posts-list">
      {{ range $posts }}
      <li>
        <time class="post-date">{{ .Date | time.Format "2006-01-02" }}</time> — 
        <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
      </li>
      {{ end }}
    </ul>
  </section>
  {{ end }}
{{ end }}
