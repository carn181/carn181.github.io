{{ define "main" }}
  <div class="posts-container">
    <h1>{{ .Title }}</h1>
    {{ if .Content }}
      <div class="section-intro">
        {{ .Content }}
      </div>
    {{ end }}

    <ul class="posts-list">
      {{ range .Pages }}
        <li style="margin-bottom: 0.75rem;">
          <h2 style="margin: 0; font-size: 1.2rem; font-weight: normal;">
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          </h2>
        </li>
      {{ end }}
    </ul>
  </div>
{{ end }}
